name: build-plugin

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build ndd-mdview (x64)
    runs-on: windows-2022
    env:
      WV2_VER: 1.0.2903.40
      QT_VER: 5.15.2
      QT_ARCH: win64_msvc2019_64
      # aqt extracts into <ver>/<dir>; the dir is msvc2019_64 (no win64_ prefix)
      QT_DIR: msvc2019_64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch WebView2 SDK
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path '3rdparty' | Out-Null
          $nupkg = Join-Path (Get-Location) '3rdparty\webview2.zip'
          Invoke-WebRequest -Uri "https://www.nuget.org/api/v2/package/Microsoft.Web.WebView2/$env:WV2_VER" -OutFile $nupkg
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $dest = Join-Path (Get-Location) '3rdparty\webview2'
          [System.IO.Compression.ZipFile]::ExtractToDirectory($nupkg, $dest)
          # nupkg 里是 build/native/... ，搬到 CMake 期望的扁平布局
          New-Item -ItemType Directory -Force -Path '3rdparty\webview2\include' | Out-Null
          New-Item -ItemType Directory -Force -Path '3rdparty\webview2\x64' | Out-Null
          Copy-Item "$dest\build\native\include\WebView2.h" '3rdparty\webview2\include\'
          Copy-Item "$dest\build\native\x64\WebView2LoaderStatic.lib" '3rdparty\webview2\x64\'
          Write-Host "--- webview2 files ready ---"
          Get-ChildItem '3rdparty\webview2' -Recurse -File | Select-Object FullName, Length

      - name: Fetch KaTeX assets
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # KaTeX（公式渲染）+ markdown-it-katex（markdown-it 的 $...$ 插件）
          # 版本钉死，保证可复现。
          New-Item -ItemType Directory -Force -Path 'assets\fonts' | Out-Null
          New-Item -ItemType Directory -Force -Path 'katex_pkg' | Out-Null
          New-Item -ItemType Directory -Force -Path 'mdit_pkg' | Out-Null
          Push-Location 'katex_pkg'
          npm pack katex@0.16.11 | Out-Null
          Pop-Location
          Push-Location 'mdit_pkg'
          npm pack markdown-it-katex@2.0.3 | Out-Null
          Pop-Location
          $k = Get-ChildItem 'katex_pkg' -Filter '*.tgz' | Select-Object -First 1
          tar -xzf $k.FullName -C 'katex_pkg'
          $m = Get-ChildItem 'mdit_pkg' -Filter '*.tgz' | Select-Object -First 1
          tar -xzf $m.FullName -C 'mdit_pkg'
          Copy-Item 'katex_pkg\package\dist\katex.min.js' 'assets\'
          Copy-Item 'katex_pkg\package\dist\katex.min.css' 'assets\'
          Copy-Item 'katex_pkg\package\dist\fonts\*.woff2' 'assets\fonts\'

          # markdown-it-katex 是 CommonJS 模块，套一层浏览器 shim：
          #   require('katex') -> window.katex
          $shim = @"
(function(){
  function require(name){
    if (name === 'katex') { return window.katex; }
    throw new Error('unknown module: ' + name);
  }
  var module = { exports: {} };
  var exports = module.exports;
  __BODY__
  window.markdownitKatex = module.exports;
})();
"@
          $body = Get-Content 'mdit_pkg\package\index.js' -Raw
          $shim.Replace('__BODY__', $body) | Set-Content 'assets\markdown-it-katex.js' -Encoding utf8

          # 生成 KaTeX 资源的 qrc（字体用 alias 指到 fonts/）
          $qrc = "<RCC>`n  <qresource prefix=`"/mdview`">`n"
          foreach ($f in @('katex.min.js','katex.min.css','markdown-it-katex.js')) {
            $qrc += "    <file alias=`"$f`">$f</file>`n"
          }
          foreach ($f in (Get-ChildItem 'assets\fonts' -Filter '*.woff2' | Sort-Object Name)) {
            $qrc += "    <file alias=`"fonts/$($f.Name)`">fonts/$($f.Name)</file>`n"
          }
          $qrc += "  </qresource>`n</RCC>`n"
          Set-Content 'assets\katex.qrc' $qrc -Encoding utf8
          Write-Host "--- katex assets ready ---"
          Get-ChildItem 'assets' -Recurse -File | Select-Object FullName, Length

      - name: Install Qt
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install --upgrade pip
          python -m pip install aqtinstall
          # NOTE: for Qt 5.15 the qtbase payload lives in the *base* package,
          # not as a standalone module. Use --archives qtbase; "-m qtbase" fails
          # with "packages not found".
          python -m aqt install-qt windows desktop $env:QT_VER $env:QT_ARCH --archives qtbase --outputdir "${{ github.workspace }}\Qt"
          Write-Host "--- qt root ---"
          Get-ChildItem "${{ github.workspace }}\Qt\$env:QT_VER" | Select-Object -ExpandProperty Name
          Write-Host "--- cmake config ---"
          Get-ChildItem "${{ github.workspace }}\Qt\$env:QT_VER\$env:QT_DIR\lib\cmake" | Select-Object -ExpandProperty Name

      - name: Configure
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cmake -S . -B build `
            -G "Visual Studio 17 2022" `
            -A x64 `
            "-DCMAKE_PREFIX_PATH=${{ github.workspace }}\Qt\$env:QT_VER\$env:QT_DIR"

      - name: Build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cmake --build build --config Release --parallel
          Get-ChildItem -Path build -Recurse -Filter 'ndd-mdview.dll' |
            Select-Object FullName, Length

      - name: Collect artifact
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path 'dist' | Out-Null
          Copy-Item 'build\bin\Release\ndd-mdview.dll' 'dist\'
          Get-ChildItem 'dist' | Select-Object Name, Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ndd-mdview-x64
          path: dist/
